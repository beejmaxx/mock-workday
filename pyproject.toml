[project]
name = "mock-workday"
version = "0.1.0"
description = "Synthetic multi-tenant HCM lab"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<0.140",
    "uvicorn>=0.30,<1",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "PyJWT[crypto]>=2,<3",
    "python-multipart>=0.0.20",
    "boto3>=1.40,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
addopts = "-m 'not bulk'"
markers = ["bulk: full-scale deterministic import and recovery checks"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/mock_workday"]
