services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres-lab
    volumes:
      - database:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
  service:
    build: .
    image: mock-workday:m2
    environment:
      MW_TEST_ADMIN: ${MW_TEST_ADMIN:-0}
    ports:
      - "127.0.0.1:${MW_PUBLIC_PORT:-8080}:8080"
      - "127.0.0.1:${MW_ADMIN_PORT:-8081}:8081"
    depends_on:
      db:
        condition: service_healthy
volumes:
  database:
